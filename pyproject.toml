[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Gateway that fronts several MCP servers: namespacing, per-client allow-lists, rate limits and audit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
mcpgate = "mcpgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
